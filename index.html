  .pax-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }

  .pax-row .pax-remove {
    background: #fdeceD; color: #c0392b; border: 1px solid #f3c9c9; border-radius: 4px;
    width: 32px; height: 34px; flex-shrink: 0; cursor: pointer; font-weight: bold; font-size: 15px;
  }
  .warn { background: #fff4e5; border: 1px solid #f0b458; color: #7a4a00; padding: 8px 10px; border-radius: 5px; font-size: 12px; margin-bottom: 10px; }

  .btn-row { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
  button {
    background: #0e6b3a; color: #fff; border: none; padding: 10px 16px;
    border-radius: 5px; font-size: 13.5px; cursor: pointer; font-weight: bold;
  }
  button.secondary { background: #16406b; }
  button.grey { background: #6b7280; }
  button.small { padding: 6px 10px; font-size: 12px; }
  button:hover { opacity: 0.9; }

  table.mgmt td.del { text-align: center; cursor: pointer; color: #c0392b; font-weight: bold; }
  .mgmt-scroll { max-height: 220px; overflow-y: auto; border: 1px solid #eee; }

  #ticket-wrap { max-width: 900px; margin: 0 auto; }

  .logo-text-ix span { color: #16406b; font-style: italic; font-weight: normal; font-size: 24px; }
  .logo-text-ov { font-size: 27px; font-weight: bold; color: #009f5d; }
  .logo-text-ov span { color: #16406b; }

<div class="wrap">

  <div class="panel">
    <h2>1. Route &amp; Date Chuno</h2>
    <div class="form-row">
      <div class="field">
        <label>Route / Airline</label>
        <select id="route" onchange="onRouteChange()"></select>
      </div>
      <div class="field">
        <label>Travel Date (isme se PNR auto aayega)</label>
        <select id="dateSelect" onchange="onDateChange()"></select>
      </div>
      <div class="field">
        <label>PNR (auto-filled — edit bhi kar sakte ho)</label>
        <input type="text" id="pnr">
      </div>
    </div>
    <div id="dupWarning"></div>
  </div>

  <div class="panel">
    <h2>2. Passenger Detail</h2>
    <div class="field" style="margin-bottom:10px;">
      <label>Passenger Naam(s) (Mr./Mrs./Ms. ke sath) — ek PNR me ek se zyada pax ho to "+ Add Passenger" dabao</label>
      <div id="paxListWrap"></div>
      <button class="small secondary" style="margin-top:6px;" onclick="addPaxRow()">+ Add Passenger</button>
    </div>
    <div class="form-row">
      <div class="field">
        <label>Booking No / E-Tkt No</label>
        <input type="text" id="bookingNo">
      </div>
      <div class="field">
        <label>Booking Date</label>
        <input type="date" id="bookingDate">
      </div>
      <div class="field">
        <label>Baggage (Check-in | Cabin) — sab passengers ke liye same</label>
        <input type="text" id="baggage">
      </div>
    </div>
    <div class="btn-row">
      <button onclick="renderTicket()">Ticket Banao</button>
      <button class="secondary" onclick="exportPDF()">PDF Export</button>
    </div>
  </div>

  <div class="panel">
    <details>
      <summary>PNR Inventory Manage Karo (add / edit / delete)</summary>
      <div class="form-row" style="margin-top:10px;">
        <div class="field">
          <label>Date</label>
          <input type="date" id="newDate">
        </div>
        <div class="field">
          <label>PNR</label>
          <input type="text" id="newPnr">
        </div>
        <div class="field">
          <label>Note (optional — fare/batch)</label>
          <input type="text" id="newNote">
        </div>
        <div class="field" style="flex:0 0 auto; align-self:flex-end;">
          <button class="small" onclick="addInventoryRow()">+ Add Entry</button>
        </div>
      </div>
      <div class="mgmt-scroll">
        <table class="mgmt" id="mgmtTable">
          <thead><tr><th>Date</th><th>PNR</th><th>Note</th><th>Del</th></tr></thead>
          <tbody id="mgmtBody"></tbody>
        </table>
      </div>
    </details>
  </div>

  <div id="ticket-wrap"><div id="ticket"></div></div>

</div>

<script>
/* ============ PASSENGER LIST ============ */
let paxRows = 1;

function renderPaxRows() {
  const wrap = document.getElementById('paxListWrap');
  const existingVals = Array.from(wrap.querySelectorAll('input')).map(i => i.value);
  wrap.innerHTML = '';
  for (let i = 0; i < paxRows; i++) {
    const row = document.createElement('div');
    row.className = 'pax-row';
    const removeBtn = paxRows > 1
      ? `<button type="button" class="pax-remove" onclick="removePaxRow(${i})">✕</button>`
      : '';
    row.innerHTML = `<input type="text" class="paxNameInput" placeholder="MR./MRS./MS. FULL NAME" value="${existingVals[i] || ''}">${removeBtn}`;
    wrap.appendChild(row);
  }
}
function addPaxRow() {
  paxRows++;
  renderPaxRows();
}
function removePaxRow(idx) {
  const wrap = document.getElementById('paxListWrap');
  const inputs = Array.from(wrap.querySelectorAll('input'));
  inputs.splice(idx, 1);
  const vals = inputs.map(i => i.value);
  paxRows = Math.max(1, paxRows - 1);
  renderPaxRows();
  const newInputs = Array.from(wrap.querySelectorAll('input'));
  vals.forEach((v, i) => { if (newInputs[i]) newInputs[i].value = v; });
}
function getPaxNames() {
  const vals = Array.from(document.querySelectorAll('.paxNameInput')).map(i => i.value.trim()).filter(v => v);
  return vals.length ? vals : ['MR. '];
}

const STORAGE_PREFIX = "inv:";

/* ============ INIT / STORAGE ============ */
async function loadInventory(routeKey) {
  try {
    const r = await window.storage.get(STORAGE_PREFIX + routeKey, false);
    if (r && r.value) return JSON.parse(r.value);
  } catch (e) { /* not saved yet */ }
  return ROUTES[routeKey].inventory;
}
async function saveInventory(routeKey, list) {
  try { await window.storage.set(STORAGE_PREFIX + routeKey, JSON.stringify(list), false); }
  catch (e) { console.error("save failed", e); }
}

let currentInventory = [];

async function onRouteChange() {
  const routeKey = document.getElementById('route').value;
  currentInventory = await loadInventory(routeKey);
  populateDateSelect();
  populateMgmtTable();
  const r = ROUTES[routeKey];
  document.getElementById('baggage') && setBaggageIfExists(r.defaultBaggage);
  onDateChange();
}

function setBaggageIfExists(val) {
  const el = document.getElementById('baggage');
  if (el) el.value = val || '';
}

function populateDateSelect() {
  const sel = document.getElementById('dateSelect');
  sel.innerHTML = '';
  const sorted = [...currentInventory].sort((a,b) => a.date.localeCompare(b.date) || a.pnr.localeCompare(b.pnr));
  sorted.forEach(row => {
    const opt = document.createElement('option');
    opt.value = JSON.stringify(row);
    const noteStr = row.note ? ` — ${row.note}` : '';
    opt.textContent = `${row.date}  |  ${row.pnr}${noteStr}`;
    sel.appendChild(opt);
  });
}

function onDateChange() {
  const sel = document.getElementById('dateSelect');
  if (!sel.value) { document.getElementById('dupWarning').innerHTML = ''; return; }
  const row = JSON.parse(sel.value);
  document.getElementById('pnr').value = row.pnr;

  // duplicate-date warning (like the G9 conflict)
  const sameDate = currentInventory.filter(r => r.date === row.date);
  const warnDiv = document.getElementById('dupWarning');
  if (sameDate.length > 1) {
    const list = sameDate.map(r => r.pnr).join(', ');
    warnDiv.innerHTML = `<div class="warn">⚠ Is date (${row.date}) ke liye inventory me ek se zyada PNR mile hain: <b>${list}</b>. Sahi wala confirm kar lo bhejne se pehle.</div>`;
  } else {
    warnDiv.innerHTML = '';
  }
}

function populateMgmtTable() {
  const routeKey = document.getElementById('route').value;
  const body = document.getElementById('mgmtBody');
  body.innerHTML = '';
  const sorted = [...currentInventory].sort((a,b) => a.date.localeCompare(b.date));
  sorted.forEach((row, idx) => {
    const realIdx = currentInventory.indexOf(row);
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${row.date}</td><td>${row.pnr}</td><td>${row.note || ''}</td><td class="del" onclick="deleteInventoryRow(${realIdx})">✕</td>`;
    body.appendChild(tr);
  });
}

async function addInventoryRow() {
  const date = document.getElementById('newDate').value;
  const pnr = document.getElementById('newPnr').value.trim().toUpperCase();
  const note = document.getElementById('newNote').value.trim();
  if (!date || !pnr) { alert('Date aur PNR dono chahiye'); return; }
  currentInventory.push({date, pnr, note});
  const routeKey = document.getElementById('route').value;
  await saveInventory(routeKey, currentInventory);
  document.getElementById('newDate').value = '';
  document.getElementById('newPnr').value = '';
  document.getElementById('newNote').value = '';
  populateDateSelect();
  populateMgmtTable();
}

async function deleteInventoryRow(idx) {
  currentInventory.splice(idx, 1);
  const routeKey = document.getElementById('route').value;
  await saveInventory(routeKey, currentInventory);
  populateDateSelect();
  populateMgmtTable();
  onDateChange();
}

/* ============ FORMAT HELPERS ============ */
function fmtDateSpace(d) {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${String(d.getDate()).padStart(2,'0')} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function fmtDateDash(d) {
  const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  return `${String(d.getDate()).padStart(2,'0')}-${months[d.getMonth()]}-${d.getFullYear()}`;
}
function fmtTime24(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
}
function fmtTime12(d) {
  let h = d.getHours(), m = d.getMinutes();
  const ampm = h >= 12 ? 'PM' : 'AM';
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${String(h12).padStart(2,'0')}:${String(m).padStart(2,'0')} ${ampm}`;
}
function fmtTimePM(d) {
  return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')} PM`;
}
function slug(s) {
  return (s || '')
    .replace(/^(mr|mrs|ms|miss)\.?\s*/i, '')
    .trim().toUpperCase()
    .replace(/[^A-Z0-9]+/g, '_')
    .replace(/^_+|_+$/g, '');
}
function parseDateVal(v) {
  const [y,m,d] = v.split('-').map(Number);
  return {y,m,d};
}

function paxTable(paxNames, pnr, baggage, uppercaseName) {
  const nameClass = uppercaseName === false ? '' : 'paxname';
  const rows = paxNames.map((name, i) => `
      <tr><td>${i+1}</td><td class="${nameClass}">${name}</td><td class="pnrcell">${pnr}</td><td>${baggage}</td></tr>`).join('');
  return `
    <div class="tear-divider">✈</div>
    <div class="section-title">Passenger Information${paxNames.length > 1 ? ` (${paxNames.length} PAX)` : ''}</div>
    <table class="pax-table">
      <tr><th style="width:6%">Sr</th><th style="width:44%">Name</th><th style="width:20%">PNR</th><th style="width:30%">Baggage(Check-in | Cabin)</th></tr>
      ${rows}
    </table>
  `;
}
function footerStrip(templateKey, pnr) {
  const airlineNames = {sv:'Saudia', ix:'Air India Express', ov:'SalamAir', g9:'Air Arabia'};
  return `
    <div class="ticket-footer">
      <span>Generated for PNR <b>${pnr}</b> &middot; ${airlineNames[templateKey] || ''}</span>
      <span class="thanks">Have a safe flight</span>
    </div>
  `;
}
function importantInfoBox() {
  return `
    <div class="info-box">
      <div class="ib-title">Important Information</div>
      <ol>
        <li>You must web check-in on the airline website and obtain a boarding pass.</li>
        <li>You must download &amp; register on the Aarogya Setu App and carry a valid ID.</li>
        <li>It is mandatory to wear a mask and carry other protective gear.</li>
        <li>Reach the terminal at least 2 hours prior to the departure for domestic flight and 4 hours prior to the departure of international flight.</li>
        <li>For departure terminal please check with the airline first.</li>
        <li>Date &amp; Time is calculated based on the local time of the city/destination.</li>
        <li>Use the Airline PNR for all Correspondence directly with the Airline</li>
        <li>For rescheduling/cancellation within 4 hours of the departure time contact the airline directly</li>
        <li>Your ability to travel is at the sole discretion of the airport authorities and we shall not be held responsible.</li>
      </ol>
    </div>
  `;
}
function termsBox() {
  return `
    <div class="info-box">
      <div class="ib-title">Terms &amp; Conditions</div>
      <ol>
        <li>This group/series/FDs ticket is 100% Non Refundable, Non Changeable &amp; Non Cancellable.</li>
        <li>Charged fare is totally agreed between 'BUYER &amp; SELLER', any issues related to fares thereafter will not be entertained.</li>
        <li>Check flight &amp; passenger(s) details directly by logging / calling to the respective airlines, any dispute with in 24 hours prior to departure will not be entertained.</li>
        <li>No updates will be shared from our end in respect to flight cancellation / changes in timings, 'BUYER' had to check directly with the respective airlines before departure.</li>
      </ol>
    </div>
  `;
}

async function exportPDF() {
  const node = document.getElementById('ticket');
  if (!node.innerHTML.trim()) { alert('Pehle "Ticket Banao" dabao'); return; }
  const canvas = await html2canvas(node, { scale: 1.5, backgroundColor: '#ffffff' });
  const imgData = canvas.toDataURL('image/jpeg', 0.82);
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ orientation: 'p', unit: 'pt', format: 'a4', compress: true });
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const imgHeight = (canvas.height * imgWidth) / canvas.width;
  let heightLeft = imgHeight, position = 0;
  pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
  heightLeft -= pageHeight;
  while (heightLeft > 0) {
    position = heightLeft - imgHeight;
    pdf.addPage();
    pdf.addImage(imgData, 'JPEG', 0, position, imgWidth, imgHeight, undefined, 'FAST');
    heightLeft -= pageHeight;
  }
  const m = window.currentMeta || {};
  const pnr = slug(m.pnr) || 'PNR';
  const names = m.paxNames || [];
  const name = names.length
    ? (names.length > 1 ? `${slug(names[0])}_PLUS${names.length - 1}` : slug(names[0]))
    : 'PASSENGER';
  const airline = m.airline || 'AIRLINE';
  const fname = `${m.prefix || 'SECTOR'}_${m.dateStr || 'DATE'}_${name}_${pnr}_${airline}.pdf`;
  pdf.save(fname);
}

/* ============ BOOT ============ */
(async function boot() {
  const sel = document.getElementById('route');
  Object.keys(ROUTES).forEach(key => {
    const opt = document.createElement('option');
    opt.value = key;
    opt.textContent = ROUTES[key].label;
    sel.appendChild(opt);
  });
  document.getElementById('bookingDate').value = new Date().toISOString().slice(0,10);
  renderPaxRows();
  await onRouteChange();
})();
